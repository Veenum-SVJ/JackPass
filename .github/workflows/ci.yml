name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        # The e2e suite mocks Supabase/Paystack/AI at the network layer, so no
        # secrets are required. The visual-regression baselines are
        # Windows-generated (win32) and cannot be compared on Linux runners yet;
        # generate Linux baselines first to enable them:
        #   npx playwright test e2e/visual.spec.ts --update-snapshots
        run: npx playwright test --grep-invert "visual regression"

      - name: Production build
        run: npm run build