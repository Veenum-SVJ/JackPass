name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
  # Nightly full-suite run (includes visual regression) — catches long-term
  # UI drift and environment rot even when nothing is pushed.
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      # Playwright browser binaries (~150 MB) are cached per lockfile so CI
      # only downloads them once per @playwright/test bump.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      # System deps (apt libs + fonts) are always installed — a fresh runner
      # doesn't keep them — but the browser binaries themselves come from cache.
      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Create test env (placeholders — e2e mocks all external services)
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service
          GOOGLE_AI_API_KEY=placeholder
          EOF

      - name: E2E tests (Playwright)
        run: npx playwright test

      # When the nightly visual run catches UI drift, upload the diff images
      # and traces so a maintainer can actually see what changed.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production build
        run: npm run build